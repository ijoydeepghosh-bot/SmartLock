<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLock | Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin_login.css') }}">
</head>
<body>

    <div class="login-container">

        <div class="login-icon">🔐</div>

        <h1>SmartLock</h1>
        <p class="subtitle">Administrator Login</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       placeholder="Enter admin username"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       placeholder="Enter password"
                       required>
            </div>

            <p id="errorMessage"></p>

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <p class="footer-text">SmartLock Administration System</p>

    </div>

    <script src="{{ url_for('static', filename='js/admin_login.js') }}"></script>

</body>
</html>
