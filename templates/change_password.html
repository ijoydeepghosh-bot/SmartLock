<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLock | Change Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/change_password.css') }}">
</head>
<body>

<div class="password-container">

    <div class="icon">🔐</div>

    <h1>Change Password</h1>
    <p class="subtitle">Update your administrator password</p>

    <form id="passwordForm">

        <label for="oldPassword">Current Password</label>
        <input type="password" id="oldPassword"
               placeholder="Enter current password" required>

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword"
               placeholder="Enter new password" required>

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Confirm new password" required>

        <p id="message"></p>

        <button type="submit" id="changeButton">
            Update Password
        </button>

    </form>

    <a href="/">Back to Dashboard</a>

</div>

<script src="{{ url_for('static', filename='js/change_password.js') }}"></script>

</body>
</html>
